# ==============================================================================
# postgresql.conf — Production-Grade Configuration
# ==============================================================================
# Target: Dedicated PostgreSQL server, general-purpose OLTP workload
# Hardware profile this config is tuned for:
#   RAM:        4 GB
#   CPU:        4 cores
#   Storage:    NVMe SSD
#   Connections: up to 100 concurrent clients (use PgBouncer for more)
# ==============================================================================


# ------------------------------------------------------------------------------
# CONNECTIONS & AUTHENTICATION
# ------------------------------------------------------------------------------

listen_addresses = '*'                  # Docker-only network; access remains constrained by Compose + pg_hba.conf
port = 5432
max_connections = 100                   # [TUNE] On 4GB, 200 is risky (~5–10MB overhead/conn)
                                        # Use PgBouncer if you need more application connections
superuser_reserved_connections = 5      # Always reserve seats for admin access

authentication_timeout = 30s
password_encryption = scram-sha-256     # Modern, secure — do NOT use md5


# ------------------------------------------------------------------------------
# MEMORY
# ------------------------------------------------------------------------------

# shared_buffers: ~25% of total RAM
shared_buffers = 1GB                    # 25% of 4GB

# effective_cache_size: estimate of OS page cache + shared_buffers
# Used only by the query planner — not an actual allocation.
effective_cache_size = 3GB              # ~75% of 4GB

# work_mem: memory per sort/hash operation, per query, per connection
# Formula: (RAM - shared_buffers) / (max_connections * ~3 ops)
# 100 connections x 3 ops x 10MB = ~3GB worst case — conservative is safer
work_mem = 10MB                         # [TUNE] Raise to 16–32MB only if queries spill to disk
                                        # Check pg_stat_statements for temp file usage first

# maintenance_work_mem: used by VACUUM, CREATE INDEX, ALTER TABLE
maintenance_work_mem = 256MB            # Scaled down from 512MB; still fast for index builds

# huge_pages: silently skips if OS not configured — safe to leave as-is
huge_pages = try

# temp_buffers: per-session temporary table buffer
temp_buffers = 16MB                     # Reduced from 32MB to conserve memory


# ------------------------------------------------------------------------------
# WRITE-AHEAD LOG (WAL) & DURABILITY
# ------------------------------------------------------------------------------

wal_level = replica                     # Enables streaming replication & logical decoding
fsync = on                              # NEVER turn off in production — data integrity
synchronous_commit = on                 # Safest default; 'local' or 'off' only for analytics
full_page_writes = on                   # Required after a crash; keep on

wal_buffers = 16MB                      # Reduced from 64MB; appropriate for 4GB RAM
                                        # -1 = auto (3% of shared_buffers = ~30MB, also fine)

# Checkpoint tuning — spread out I/O to avoid latency spikes
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_wal_size = 1GB                      # Reduced from 4GB; trigger checkpoint if exceeded
min_wal_size = 256MB                    # Reduced from 1GB

# WAL compression (Postgres 15+)
wal_compression = zstd                  # Reduces WAL volume; negligible CPU cost on modern hardware


# ------------------------------------------------------------------------------
# REPLICATION (enable if using streaming replication)
# ------------------------------------------------------------------------------

# Uncomment for primary server:
# max_wal_senders = 3
# wal_keep_size = 512MB
# max_replication_slots = 3

# Uncomment for synchronous replica:
# synchronous_standby_names = 'standby1'


# ------------------------------------------------------------------------------
# QUERY PLANNER
# ------------------------------------------------------------------------------

random_page_cost = 1.1                  # [TUNE] 1.1 for NVMe/SSD; 4.0 for spinning HDD
seq_page_cost = 1.0
effective_io_concurrency = 200          # [TUNE] 200 for SSD/NVMe; 2–4 for HDD

# Parallelism — tuned for 4 CPU cores
max_worker_processes = 4                # = number of CPU cores
max_parallel_workers = 4               # = number of CPU cores
max_parallel_workers_per_gather = 2    # = half of max_parallel_workers
max_parallel_maintenance_workers = 2   # = half of max_parallel_workers

# JIT — disabled on small servers; compilation overhead outweighs gains for OLTP
jit = off                               # Re-enable only if running analytical/reporting workloads


# ------------------------------------------------------------------------------
# LOGGING
# ------------------------------------------------------------------------------

logging_collector = on
log_directory = 'log'                   # Relative to data directory; use absolute path in containers
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 128MB               # Reduced from 256MB to conserve disk on small servers
log_truncate_on_rotation = on

log_min_duration_statement = 1000       # Log queries slower than 1s; lower to 250ms for tuning
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0                      # Log all temp file creation (helpful to detect work_mem issues)
log_autovacuum_min_duration = 1000      # Log autovacuum runs longer than 1s

log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_timezone = 'UTC'

log_statement = 'ddl'                   # Logs schema changes; use 'all' only while debugging


# ------------------------------------------------------------------------------
# AUTOVACUUM
# ------------------------------------------------------------------------------

autovacuum = on                         # NEVER disable in production
autovacuum_max_workers = 2              # Reduced from 4; sufficient for moderate write volume
autovacuum_naptime = 30s

autovacuum_vacuum_scale_factor = 0.02   # Vacuum after 2% of rows changed (default 0.2 is too lazy)
autovacuum_analyze_scale_factor = 0.01  # Analyze after 1% of rows changed

autovacuum_vacuum_cost_delay = 2ms
autovacuum_vacuum_cost_limit = 200      # Reduced from 400; less I/O pressure on constrained server


# ------------------------------------------------------------------------------
# BACKGROUND WRITER
# ------------------------------------------------------------------------------

bgwriter_delay = 50ms
bgwriter_lru_maxpages = 100
bgwriter_lru_multiplier = 2.0
bgwriter_flush_after = 512kB


# ------------------------------------------------------------------------------
# LOCKING & DEADLOCKS
# ------------------------------------------------------------------------------

deadlock_timeout = 1s
lock_timeout = 30s                      # Abort queries waiting >30s for a lock
statement_timeout = 60s                 # Hard kill for runaway queries; tune per workload
idle_in_transaction_session_timeout = 60s  # Kill idle-in-transaction sessions; prevents lock pile-ups


# ------------------------------------------------------------------------------
# CLIENT CONNECTION DEFAULTS
# ------------------------------------------------------------------------------

default_transaction_isolation = 'read committed'
client_encoding = 'UTF8'
timezone = 'UTC'
datestyle = 'iso, mdy'
intervalstyle = 'postgres'

# Uncomment for better schema hygiene (prevents accidental public schema pollution):
# search_path = '"$user"'


# ------------------------------------------------------------------------------
# STATISTICS
# ------------------------------------------------------------------------------

default_statistics_target = 100         # [TUNE] Raise to 200–500 for complex/slow query plans
track_counts = on
track_io_timing = on                    # Required for I/O breakdown in pg_stat_statements
track_wal_io_timing = on
track_functions = pl                    # Track execution stats for PL/pgSQL functions


# ------------------------------------------------------------------------------
# EXTENSIONS (loaded at startup)
# ------------------------------------------------------------------------------

shared_preload_libraries = 'pg_stat_statements, auto_explain'

# pg_stat_statements — essential for identifying slow/expensive queries
pg_stat_statements.track = all
pg_stat_statements.max = 5000           # Reduced from 10000; sufficient for most workloads

# auto_explain — logs query plans for slow queries automatically
auto_explain.log_min_duration = 5000    # Log plans for queries taking >5s
auto_explain.log_analyze = on
auto_explain.log_buffers = on
auto_explain.log_nested_statements = on


# ------------------------------------------------------------------------------
# SSL / ENCRYPTION
# ------------------------------------------------------------------------------

ssl = off                              # TLS is terminated at Caddy; enable only when certs are mounted into the container

# Uncomment to require mutual TLS (client certificate auth):
# ssl_ca_file = 'root.crt'


# ------------------------------------------------------------------------------
# MISCELLANEOUS
# ------------------------------------------------------------------------------

# Locale
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'


# ==============================================================================
# COMPANION: pg_hba.conf recommendations
# ==============================================================================
#
#   # TYPE  DATABASE  USER  ADDRESS          METHOD
#   local   all       postgres               peer
#   local   all       all                    scram-sha-256
#   host    all       all   127.0.0.1/32     scram-sha-256
#   host    all       all   ::1/128          scram-sha-256
#   hostssl all       all   10.0.0.0/8       scram-sha-256   # Internal network, SSL required
#
#   Never use "trust" for network connections in production.
#
# ==============================================================================
